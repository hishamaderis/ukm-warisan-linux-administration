version: v1
mig-configs:    
  all-disabled:   
    - devices: all      
      mig-enabled: false
                                                           
  all-enabled:    
    - devices: all  
      mig-enabled: true
      mig-devices: {}  
                                                           
  all-1g.18gb:      
    - devices: all
      mig-enabled: true
      mig-devices:
        "1g.18gb": 7
                                                           
  all-1g.35gb:
    - devices: all
      mig-enabled: true
      mig-devices:
        "1g.35gb": 4

  all-2g.35gb:
    - devices: all
      mig-enabled: true
      mig-devices:
        "2g.35gb": 3

  all-3g.71gb:
    - devices: all
      mig-enabled: true
      mig-devices:
        "3g.71gb": 2

  all-4g.71gb:
    - devices: all
      mig-enabled: true
      mig-devices:
        "4g.71gb": 1

  all-7g.141gb:
    - devices: all
      mig-enabled: true
      mig-devices:
        "7g.141gb": 1

  all-balanced:
    - devices: all
      mig-enabled: true
      mig-devices:
        "1g.18gb": 2
        "2g.35gb": 1
        "3g.71gb": 1

  custom-config:
    - devices: [0]
      mig-enabled: false
    - devices: [1]
      mig-enabled: true
      mig-devices:
        "1g.18gb": 7
    - devices: [2]
      mig-enabled: true
      mig-devices:
        "2g.35gb": 3
    - devices: [3]
      mig-enabled: true
      mig-devices:
        "3g.71gb": 2

